<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Щасливий день</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #181c24;
      --accent-gold: #d4af37;
      --text-main: #f0f3f8;
      --text-sub: #a0a8b6;
      --btn-grad: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .user-greeting {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .header-date {
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 80px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .prediction-box {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-main);
      margin: 20px 0;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      width: 100%;
      text-align: center;
    }

    .btn-main {
      background: var(--btn-grad);
      color: #000;
      border: none;
      padding: 16px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
    }

    .btn-main:active { transform: scale(0.96); }
    .btn-main:disabled {
      background: #2a2e39;
      color: var(--text-sub);
      box-shadow: none;
      cursor: not-allowed;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .zodiac-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 15px;
    }

    .zodiac-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      color: var(--text-main);
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .zodiac-btn.active {
      border-color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.25);
      font-weight: bold;
    }

    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #12151c;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-btn.active { color: var(--accent-gold); font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <div id="user-greeting" class="user-greeting">Вітаю! ✨</div>
    <div id="current-date" class="header-date"></div>
  </div>

  <!-- Вкладка Передбачення -->
  <div id="tab-wish" class="card">
    <div style="font-size: 40px; margin-bottom: 10px;">🥠</div>
    <div id="wish-display" class="prediction-box">
      Розгорни своє печиво з передбаченням і дізнайся, яка магія чекає на тебе сьогодні!
    </div>
    <button id="btn-wish" class="btn-main" onclick="getWish()">🥠 Розкрити передбачення</button>
  </div>

  <!-- Вкладка Гороскоп -->
  <div id="tab-horoscope" class="card hidden">
    <div style="font-size: 30px;">🔮</div>
    <div id="horoscope-display" class="prediction-box">
      Обери свій знак зодіаку нижче, щоб отримати астрологічний прогноз на сьогодні.
    </div>
    <div class="zodiac-grid">
      <button class="zodiac-btn" onclick="getHoroscope('Овен', this)">♈ Овен</button>
      <button class="zodiac-btn" onclick="getHoroscope('Телець', this)">♉ Телець</button>
      <button class="zodiac-btn" onclick="getHoroscope('Близнюки', this)">♊ Близнюки</button>
      <button class="zodiac-btn" onclick="getHoroscope('Рак', this)">♋ Рак</button>
      <button class="zodiac-btn" onclick="getHoroscope('Лев', this)">♌ Лев</button>
      <button class="zodiac-btn" onclick="getHoroscope('Діва', this)">♍ Діва</button>
      <button class="zodiac-btn" onclick="getHoroscope('Терези', this)">♎ Терези</button>
      <button class="zodiac-btn" onclick="getHoroscope('Скорпіон', this)">♏ Скорпіон</button>
      <button class="zodiac-btn" onclick="getHoroscope('Стрілець', this)">♐ Стрілець</button>
      <button class="zodiac-btn" onclick="getHoroscope('Козоріг', this)">♑ Козоріг</button>
      <button class="zodiac-btn" onclick="getHoroscope('Водолій', this)">♒ Водолій</button>
      <button class="zodiac-btn" onclick="getHoroscope('Риби', this)">♓ Риби</button>
    </div>
  </div>

  <div class="nav-bar">
    <button id="nav-wish" class="nav-btn active" onclick="switchTab('wish')">🥠<br>Передбачення</button>
    <button id="nav-horoscope" class="nav-btn" onclick="switchTab('horoscope')">🔮<br>Гороскоп</button>
  </div>

  <script>
    // Ініціалізація Telegram WebApp та персоналізація
    let userName = "Друже";
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
      if (tgUser && tgUser.first_name) {
        userName = tgUser.first_name;
      }
    }
    document.getElementById('user-greeting').innerText = `Вітаю, ${userName}! ✨`;

    // Форматування поточної дати
    const now = new Date();
    const options = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
    document.getElementById('current-date').innerText = `Сьогодні, ${now.toLocaleDateString('uk-UA', options)}`;

    // Ключ сьогоднішньої дати YYYY-MM-DD для localStorage
    const todayKey = now.toISOString().split('T')[0];

    let wishesData = [];
    let horoscopesData = [];

    // Допоміжна функція витягування тексту із масиву (якщо масив рядків або об'єктів)
    function extractText(item) {
      if (!item) return '';
      if (typeof item === 'string') return item;
      return item.text || item.prediction || item.phrase || JSON.stringify(item);
    }

    // Завантаження файлів
    fetch('./data/wishes.json')
      .then(r => r.json())
      .then(data => { wishesData = data; checkSavedWish(); })
      .catch(e => console.log('Не вдалося завантажити wishes.json', e));

    fetch('./data/horoscopes.json')
      .then(r => r.json())
      .then(data => { horoscopesData = data; })
      .catch(e => console.log('Не вдалося завантажити horoscopes.json', e));

    // Перевірка, чи вже було отримано передбачення сьогодні
    function checkSavedWish() {
      const savedDate = localStorage.getItem('happy_wish_date');
      const savedText = localStorage.getItem('happy_wish_text');

      if (savedDate === todayKey && savedText) {
        displayWishText(savedText, true);
      }
    }

    function getWish() {
      const savedDate = localStorage.getItem('happy_wish_date');
      const savedText = localStorage.getItem('happy_wish_text');

      if (savedDate === todayKey && savedText) {
        displayWishText(savedText, true);
        return;
      }

      if (wishesData.length === 0) {
        document.getElementById('wish-display').innerHTML = `<i>Завантаження передбачень... Зачекайте пару секунд.</i>`;
        return;
      }

      const randomItem = wishesData[Math.floor(Math.random() * wishesData.length)];
      const text = extractText(randomItem);

      localStorage.setItem('happy_wish_date', todayKey);
      localStorage.setItem('happy_wish_text', text);

      displayWishText(text, true);
    }

    function displayWishText(text, isDone) {
      const box = document.getElementById('wish-display');
      const btn = document.getElementById('btn-wish');
      const formattedDay = now.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' });

      box.innerHTML = `<div><b>Передбачення для ${userName} на ${formattedDay}:</b><br><br>✨ "${text}"</div>`;

      if (isDone && btn) {
        btn.disabled = true;
        btn.innerText = "✨ Передбачення на сьогодні отримано";
      }
    }

    // Логіка гороскопу
    function getHoroscope(sign, btnElement) {
      // Активна кнопка
      document.querySelectorAll('.zodiac-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      const box = document.getElementById('horoscope-display');

      // Перевірка бази гороскопів на сьогодні
      let savedHoroDate = localStorage.getItem('happy_horo_date');
      let horoDict = {};

      if (savedHoroDate !== todayKey) {
        // Якщо новий день — скидаємо старі гороскопи
        localStorage.setItem('happy_horo_date', todayKey);
        localStorage.removeItem('happy_horo_dict');
      } else {
        try {
          horoDict = JSON.parse(localStorage.getItem('happy_horo_dict')) || {};
        } catch (e) { horoDict = {}; }
      }

      // Якщо для цього знаку вже є згенерований текст на сьогодні — показуємо його
      if (horoDict[sign]) {
        box.innerHTML = `<b>Прогноз для знаку ${sign} на сьогодні:</b><br><br>${horoDict[sign]}`;
        return;
      }

      // Якщо файл ще вантажиться
      if (horoscopesData.length === 0) {
        box.innerHTML = `<i>Завантаження гороскопів... Оберіть знак ще раз через секунду.</i>`;
        return;
      }

      // Генеруємо новий текст для цього знаку
      const randomItem = horoscopesData[Math.floor(Math.random() * horoscopesData.length)];
      const text = extractText(randomItem);

      // Зберігаємо у базу для цього знаку
      horoDict[sign] = text;
      localStorage.setItem('happy_horo_dict', JSON.stringify(horoDict));

      box.innerHTML = `<b>Прогноз для знаку ${sign} на сьогодні:</b><br><br>${text}`;
    }

    function switchTab(tab) {
      document.getElementById('tab-wish').classList.toggle('hidden', tab !== 'wish');
      document.getElementById('tab-horoscope').classList.toggle('hidden', tab !== 'horoscope');
      document.getElementById('nav-wish').classList.toggle('active', tab === 'wish');
      document.getElementById('nav-horoscope').classList.toggle('active', tab === 'horoscope');
    }
  </script>
</body>
</html>
