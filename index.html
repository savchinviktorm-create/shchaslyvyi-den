<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Щасливий день</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #181c24;
      --accent-gold: #d4af37;
      --text-main: #f0f3f8;
      --text-sub: #a0a8b6;
      --btn-grad: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-date {
      color: var(--accent-gold);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 80px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .prediction-box {
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-main);
      margin: 20px 0;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      width: 100%;
    }

    .btn-main {
      background: var(--btn-grad);
      color: #000;
      border: none;
      padding: 16px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
    }

    .btn-main:active { transform: scale(0.96); }

    .zodiac-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 15px;
    }

    .zodiac-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      color: var(--text-main);
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .zodiac-btn.active {
      border-color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.15);
    }

    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #12151c;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-btn.active { color: var(--accent-gold); font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <div id="current-date" class="header-date"></div>
  </div>

  <!-- Вкладка Передбачення -->
  <div id="tab-wish" class="card">
    <div style="font-size: 40px; margin-bottom: 10px;">🥠</div>
    <div id="wish-display" class="prediction-box">
      Розгорни своє печиво з передбаченням і дізнайся, яка магія чекає на тебе сьогодні!
    </div>
    <button class="btn-main" onclick="getWish()">🥠 Розкрити передбачення</button>
  </div>

  <!-- Вкладка Гороскоп -->
  <div id="tab-horoscope" class="card hidden">
    <div style="font-size: 30px;">🔮</div>
    <div id="horoscope-display" class="prediction-box">
      Обери свій знак зодіаку нижче, щоб отримати детальний астрологічний прогноз.
    </div>
    <div class="zodiac-grid">
      <button class="zodiac-btn" onclick="getHoroscope('Овен')">♈ Овен</button>
      <button class="zodiac-btn" onclick="getHoroscope('Телець')">♉ Телець</button>
      <button class="zodiac-btn" onclick="getHoroscope('Близнюки')">♊ Близнюки</button>
      <button class="zodiac-btn" onclick="getHoroscope('Рак')">♋ Рак</button>
      <button class="zodiac-btn" onclick="getHoroscope('Лев')">♌ Лев</button>
      <button class="zodiac-btn" onclick="getHoroscope('Діва')">♍ Діва</button>
      <button class="zodiac-btn" onclick="getHoroscope('Терези')">♎ Терези</button>
      <button class="zodiac-btn" onclick="getHoroscope('Скорпіон')">♏ Скорпіон</button>
      <button class="zodiac-btn" onclick="getHoroscope('Стрілець')">♐ Стрілець</button>
      <button class="zodiac-btn" onclick="getHoroscope('Козоріг')">♑ Козоріг</button>
      <button class="zodiac-btn" onclick="getHoroscope('Водолій')">♒ Водолій</button>
      <button class="zodiac-btn" onclick="getHoroscope('Риби')">♓ Риби</button>
    </div>
  </div>

  <div class="nav-bar">
    <button id="nav-wish" class="nav-btn active" onclick="switchTab('wish')">🥠<br>Передбачення</button>
    <button id="nav-horoscope" class="nav-btn" onclick="switchTab('horoscope')">🔮<br>Гороскоп</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Поточна дата
    const now = new Date();
    const options = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
    const dateFormatted = now.toLocaleDateString('uk-UA', options);
    document.getElementById('current-date').innerText = `Сьогодні, ${dateFormatted}`;

    let wishesData = [];
    let horoscopesData = [];

    // Читання файлу передбачень
    fetch('./data/wishes.json')
      .then(r => r.json())
      .then(data => { wishesData = data; })
      .catch(e => console.log('Не вдалося завантажити wishes.json'));

    // Читання файлу гороскопів
    fetch('./data/horoscopes.json')
      .then(r => r.json())
      .then(data => { horoscopesData = data; })
      .catch(e => console.log('Не вдалося завантажити horoscopes.json'));

    function getWish() {
      const box = document.getElementById('wish-display');
      if (wishesData.length > 0) {
        const item = wishesData[Math.floor(Math.random() * wishesData.length)];
        box.innerHTML = `<b>Сьогодні, ${now.toLocaleDateString('uk-UA', {day:'numeric', month:'long'})}:</b><br><br>✨ "${item}"`;
      } else {
        box.innerHTML = `<b>Сьогодні, ${now.toLocaleDateString('uk-UA', {day:'numeric', month:'long'})}:</b><br><br>✨ Всесвіт готує для тебе щось неймовірно солодке та незабутнє. Важливий дзвінок або зустріч уже на підході!`;
      }
    }

    function getHoroscope(sign) {
      const box = document.getElementById('horoscope-display');
      if (horoscopesData.length > 0) {
        const item = horoscopesData[Math.floor(Math.random() * horoscopesData.length)];
        box.innerHTML = `<b>Прогноз для знаку ${sign} на сьогодні:</b><br><br>${item}`;
      } else {
        box.innerHTML = `<b>Прогноз для знаку ${sign} на сьогодні:</b><br><br>Зорі шикуються у вигідну для вас комбінацію. Будь-які починання, пов'язані з особистим розвитком та фінансами, матимуть успіх. Не бійтеся брати відповідальність — ви сильніші, ніж здається!`;
      }
    }

    function switchTab(tab) {
      document.getElementById('tab-wish').classList.toggle('hidden', tab !== 'wish');
      document.getElementById('tab-horoscope').classList.toggle('hidden', tab !== 'horoscope');
      document.getElementById('nav-wish').classList.toggle('active', tab === 'wish');
      document.getElementById('nav-horoscope').classList.toggle('active', tab === 'horoscope');
    }
  </script>
</body>
</html>
